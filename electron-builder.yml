appId: com.hyunmin.codemung
productName: CodeMung
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
# `identity: null` skips signing, so scripts/after-pack.cjs applies an ad-hoc
# signature. Without it macOS reports the app as damaged.
afterPack: scripts/after-pack.cjs
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: arm64
  identity: null
  extendInfo:
    LSUIElement: true
